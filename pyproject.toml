[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "gpu4dft"
version = "0.1.0"
description = "GPU-native quantum chemistry and density functional theory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pyscf = ["pyscf>=2.4"]
ase = ["ase>=3.22"]
test = ["pytest>=7.0", "pyscf>=2.4"]
bench = ["pyscf>=2.4", "scipy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/gpu4dft"]

[tool.scikit-build.cmake.define]
GPU4DFT_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
